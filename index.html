<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kanban Board BD &#8212; Visual Task Board</title>
<meta name="description" content="Offline bilingual EN/&#2476;&#2494;&#2434;&#2482;&#2494; kanban board: drag tasks between To Do, Doing and Done, with a WIP limit, filters, stats and JSON export.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div>
    <h1 data-i18n="title">Kanban Board BD</h1>
    <p class="sub" data-i18n="subtitle">Drag tasks across the board &#8212; a simple visual workflow for study, work and shop tasks.</p>
  </div>
  <button id="lang-btn" class="lang-btn">&#2476;&#2494;&#2434;&#2482;&#2494;</button>
</header>

<section class="stats" aria-label="Board statistics">
  <div class="stat"><span id="stat-todo">0</span><label data-i18n="todo">To Do</label></div>
  <div class="stat"><span id="stat-doing">0</span><label data-i18n="doing">Doing</label></div>
  <div class="stat"><span id="stat-done">0</span><label data-i18n="done">Done</label></div>
  <div class="stat"><span id="stat-pct">0%</span><label data-i18n="statsDone">done</label></div>
  <div class="stat warn"><span id="stat-overdue">0</span><label data-i18n="statsOverdue">overdue</label></div>
</section>

<p id="msg" class="msg" style="display:none" role="status"></p>

<section class="panel">
  <h2 id="form-heading" data-i18n="addCard">Add a task</h2>
  <form id="task-form">
    <div class="row">
      <label><span data-i18n="cardTitle">Task title</span>
        <input id="form-title" type="text" maxlength="120" data-i18n-ph="cardTitle" placeholder="Task title" required></label>
      <label><span data-i18n="priority">Priority</span>
        <select id="form-priority"><option value="high">High</option><option value="medium" selected>Medium</option><option value="low">Low</option></select></label>
      <label><span data-i18n="column">Start in</span>
        <select id="form-col"><option value="todo">To Do</option><option value="doing">Doing</option><option value="done">Done</option></select></label>
    </div>
    <div class="row">
      <label class="grow"><span data-i18n="desc">Details (optional)</span>
        <input id="form-desc" type="text" maxlength="500" data-i18n-ph="desc" placeholder="Details (optional)"></label>
      <label><span data-i18n="tag">Tag (optional)</span>
        <input id="form-tag" type="text" maxlength="30" data-i18n-ph="tag" placeholder="Tag (optional)"></label>
      <label><span data-i18n="due">Due date (optional)</span>
        <input id="form-due" type="date"></label>
    </div>
    <div class="row actions">
      <button id="form-submit" type="submit" data-i18n="addBtn">Add task</button>
      <button id="form-cancel" type="button" style="display:none" data-i18n="cancelBtn">Cancel</button>
    </div>
  </form>
</section>

<section class="toolbar">
  <input id="f-search" type="search" data-i18n-ph="search" placeholder="Search tasks&#8230;">
  <select id="f-priority" aria-label="Priority filter"><option value="all">All priorities</option></select>
  <select id="f-tag" aria-label="Tag filter"><option value="all">All tags</option></select>
  <label class="wip"><span data-i18n="wipLabel">Doing limit (WIP)</span>
    <input id="wip-input" type="number" min="1" max="20" value="3"></label>
  <button id="export-btn" data-i18n="exportBtn">Export JSON</button>
  <label class="import-label"><span data-i18n="importBtn">Import JSON</span>
    <input id="import-file" type="file" accept=".json,application/json" hidden></label>
  <button id="clear-btn" class="danger" data-i18n="clearBtn">Erase all</button>
</section>

<div id="clear-box" class="panel" style="display:none">
  <p data-i18n="clearConfirm">Type DELETE to erase every task.</p>
  <input id="clear-input" type="text" data-i18n-ph="clearPlaceholder" placeholder="Type DELETE">
  <button id="clear-confirm" class="danger" data-i18n="clearBtn">Erase all</button>
</div>

<main class="board">
  <section class="column" data-col="todo">
    <h2><span data-i18n="todo">To Do</span> <small id="count-todo"></small></h2>
    <div class="cards" id="col-todo"></div>
  </section>
  <section class="column" data-col="doing">
    <h2><span data-i18n="doing">Doing</span> <small id="count-doing"></small></h2>
    <div class="cards" id="col-doing"></div>
  </section>
  <section class="column" data-col="done">
    <h2><span data-i18n="done">Done</span> <small id="count-done"></small></h2>
    <div class="cards" id="col-done"></div>
  </section>
</main>

<footer>
  <p data-i18n="footer">Your tasks live only in this browser (localStorage). No account, no server, no tracking.</p>
</footer>

<script src="js/logic.js"></script>
<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
</body>
</html>
